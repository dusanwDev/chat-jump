<!DOCTYPE html>
<html>
<head>
    <title>Create Extension Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px 0;
        }
        button:hover {
            background: #0056b3;
        }
        .success {
            color: green;
            margin: 10px 0;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Chrome Extension Icon Generator</h1>
    <p>Click the button below to generate and download the required icon files.</p>

    <button onclick="generateIcons()">Generate Icons</button>

    <div id="output"></div>
    <div id="canvases"></div>

    <script>
        function generateIcons() {
            const sizes = [16, 48, 128];
            const output = document.getElementById('output');
            const canvasesDiv = document.getElementById('canvases');

            output.innerHTML = '<p class="success">Generating icons...</p>';
            canvasesDiv.innerHTML = '';

            sizes.forEach(size => {
                // Create canvas
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // Draw background
                ctx.fillStyle = '#007AFF';
                ctx.fillRect(0, 0, size, size);

                // Draw arrows
                ctx.fillStyle = 'white';
                ctx.font = `bold ${size * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⇅', size / 2, size / 2);

                // Add to page for preview
                canvasesDiv.appendChild(canvas);

                // Download
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `icon${size}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            });

            output.innerHTML = '<p class="success">✓ Icons generated! Check your Downloads folder for icon16.png, icon48.png, and icon128.png</p>';
            output.innerHTML += '<p>Move these files to your extension folder, then reload the extension in Chrome.</p>';
        }
    </script>
</body>
</html>
